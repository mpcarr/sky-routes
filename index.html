<!doctype html><html><head><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>Sky Routes</title><style>html,body{margin:0;overflow:hidden;background:#12343d;color:white;font:16px system-ui;touch-action:none}canvas{display:block;touch-action:none}#hud{position:fixed;top:12px;left:12px;font-weight:bold}#menu{position:fixed;inset:0;background:#102b35e8;display:grid;place-items:center;text-align:center}#panel{padding:28px;border-radius:20px;background:#20444c;max-width:300px}button{padding:16px 28px;background:#ffcf64;border:0;border-radius:12px;font-weight:bold;font-size:20px}</style></head><body><canvas id="c"></canvas><div id="hud">LANDED <span id="score">0</span> | BEST <span id="best">0</span></div><div id="menu"><div id="panel"><h1 id="heading">✈ Sky Routes</h1><p id="info">Draw routes from red jets, yellow planes and blue helicopters to their matching landing zones. Avoid collisions!</p><button id="start">START FLYING</button></div></div><script>(()=>{const c=document.getElementById('c'),g=c.getContext('2d'),menu=document.getElementById('menu'),heading=document.getElementById('heading'),info=document.getElementById('info'),scoreEl=document.getElementById('score'),bestEl=document.getElementById('best');let w,h,z=[],planes=[],selected=null,score=0,best=0,playing=false,last=0,spawnTime=0;try{best=+localStorage.getItem('sky-routes-best')||0}catch(e){}bestEl.textContent=best;const colors=['#ff6874','#ffce57','#65cfff'];function resize(){w=c.width=innerWidth;h=c.height=innerHeight;z=[{x:w*.2,y:h*.75,t:0},{x:w*.77,y:h*.77,t:1},{x:w*.77,y:h*.26,t:2}]}addEventListener('resize',resize);resize();const dist=(a,b)=>Math.hypot(a.x-b.x,a.y-b.y);function spawn(){let t=Math.random()*3|0,e=Math.random()*4|0,x=e===0?-25:e===1?w+25:Math.random()*w,y=e===2?-25:e===3?h+25:Math.random()*h;planes.push({x,y,t,a:Math.atan2(h/2-y,w/2-x),speed:[76,60,47][t],path:[]})}function begin(){planes=[];score=0;scoreEl.textContent=0;spawnTime=0;playing=true;menu.style.display='none';spawn();last=performance.now()}document.getElementById('start').onclick=begin;function end(){playing=false;heading.textContent='Collision!';info.textContent='You landed '+score+' aircraft. Try again!';document.getElementById('start').textContent='PLAY AGAIN';menu.style.display='grid'}function pt(e){const r=c.getBoundingClientRect();return{x:e.clientX-r.left,y:e.clientY-r.top}}c.addEventListener('pointerdown',e=>{if(!playing)return;const p=pt(e);selected=null;let d=42;for(const a of planes){let q=dist(a,p);if(q<d){selected=a;d=q}}if(selected){selected.path=[];c.setPointerCapture(e.pointerId)}});c.addEventListener('pointermove',e=>{if(!selected)return;const p=pt(e),path=selected.path;if(!path.length||dist(path[path.length-1],p)>8)path.push(p)});c.addEventListener('pointerup',()=>selected=null);c.addEventListener('pointercancel',()=>selected=null);function draw(){g.fillStyle='#183c46';g.fillRect(0,0,w,h);g.strokeStyle='#ffffff10';g.lineWidth=1;for(let x=0;x<w;x+=50){g.beginPath();g.moveTo(x,0);g.lineTo(x,h);g.stroke()}for(let y=0;y<h;y+=50){g.beginPath();g.moveTo(0,y);g.lineTo(w,y);g.stroke()}for(const p of z){g.save();g.translate(p.x,p.y);g.strokeStyle=colors[p.t];g.fillStyle=colors[p.t]+'55';g.lineWidth=3;if(p.t===2){g.beginPath();g.arc(0,0,29,0,Math.PI*2);g.fill();g.stroke();g.font='bold 29px system-ui';g.fillStyle=colors[2];g.textAlign='center';g.textBaseline='middle';g.fillText('H',0,0)}else{g.rotate(p.t===0?-.55:.55);g.fillRect(-39,-13,78,26);g.strokeRect(-39,-13,78,26)}g.restore()}for(const p of planes){if(p.path.length){g.beginPath();g.moveTo(p.x,p.y);for(const q of p.path)g.lineTo(q.x,q.y);g.strokeStyle=colors[p.t];g.lineWidth=3;g.setLineDash([6,6]);g.stroke();g.setLineDash([])}g.save();g.translate(p.x,p.y);g.rotate(p.a+Math.PI/2);g.fillStyle=colors[p.t];g.beginPath();if(p.t===2){g.ellipse(0,0,8,13,0,0,Math.PI*2);g.fill();g.fillRect(-18,-2,36,4)}else{g.moveTo(0,-20);g.lineTo(6,0);g.lineTo(19,8);g.lineTo(19,12);g.lineTo(5,8);g.lineTo(5,18);g.lineTo(-5,18);g.lineTo(-5,8);g.lineTo(-19,12);g.lineTo(-19,8);g.lineTo(-6,0);g.closePath();g.fill()}g.restore()}}function frame(t){let dt=Math.min((t-last)/1000,.05);last=t;if(playing){spawnTime+=dt;if(spawnTime>Math.max(.9,3.4-score*.045)){spawn();spawnTime=0}for(const p of [...planes]){if(p.path.length){let q=p.path[0];if(dist(p,q)<12){p.path.shift();q=p.path[0]}if(q){let target=Math.atan2(q.y-p.y,q.x-p.x),diff=Math.atan2(Math.sin(target-p.a),Math.cos(target-p.a));p.a+=Math.max(-dt*4,Math.min(dt*4,diff))}}p.x+=Math.cos(p.a)*p.speed*dt;p.y+=Math.sin(p.a)*p.speed*dt;if(dist(p,z[p.t])<30){planes.splice(planes.indexOf(p),1);scoreEl.textContent=++score;if(score>best){best=score;bestEl.textContent=best;try{localStorage.setItem('sky-routes-best',best)}catch(e){}}}else if(p.x< -100||p.x>w+100||p.y< -100||p.y>h+100)planes.splice(planes.indexOf(p),1)}outer:for(let i=0;i<planes.length;i++)for(let j=i+1;j<planes.length;j++)if(dist(planes[i],planes[j])<24){end();break outer}}draw();requestAnimationFrame(frame)}requestAnimationFrame(frame)})();</script></body></html>
